[project]
name = "gamefleet-backend"
version = "2.3.0"
description = "GameFleet API: queries game servers with their native protocols and manages the dashboard data"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.30.0",
    "docker>=7.1.0",
    "fastapi>=0.118.0",
    "mcstatus>=12.0.5",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.25",
    "uvicorn>=0.37.0",
    "python-a2s>=1.4.1",
    "satisfactory-api-client>=0.1.0",
    "aiohttp>=3.14.3",
    "pyyaml>=6.0.2",
    "ruamel-yaml>=0.18.10",
]

[tool.uv]
# satisfactory-api-client 0.2.1 declares python-dotenv~=1.0.1 but never imports it; allow the current release.
override-dependencies = ["python-dotenv>=1.2.3"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["gamefleet_backend"]

[tool.setuptools.package-data]
# Server templates for creating new game servers (services/template_service.py).
gamefleet_backend = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
