[project]
name = "gamefleet-backend"
version = "0.2.0"
description = "Placeholder :)"
readme = ""
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "docker>=7.1.0",
    "fastapi>=0.118.0",
    "mcstatus>=12.0.5",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.1,<1.1.0",
    "sqlmodel>=0.0.25",
    "uvicorn>=0.37.0",
    "python-a2s>=1.4.1",
    "satisfactory-api-client>=0.1.0",
    "aiohttp>=3.14.3",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["gamefleet_backend"]
