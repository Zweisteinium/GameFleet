# Runs GameFleet from the prebuilt Docker Hub images together with its own PostgreSQL.
# Copy to docker-compose.yml (or use `docker compose -f docker-compose-example.yml up -d`) and set DB_PASSWORD and GAMEFLEET_USERS in .env.
services:
  postgres:
    image: postgres:16
    container_name: gamefleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gamefleet}
      POSTGRES_USER: ${DB_USER:-gamefleet}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - gamefleet-postgres:/var/lib/postgresql/data

  backend:
    image: h3xachad/gamefleet-backend:${VERSION:-latest}
    container_name: gamefleet-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gamefleet}
      DB_USER: ${DB_USER:-gamefleet}
      DB_PASSWORD: ${DB_PASSWORD}
      ASSET_CACHE_DIR: /app/data/assets
      GAMEFLEET_USERS: ${GAMEFLEET_USERS:-}
      GAMEFLEET_SECRET: ${GAMEFLEET_SECRET:-}
      DOCKER_AUTO_IMPORT: ${DOCKER_AUTO_IMPORT:-true}
      # Without host networking, containers are reached through the Docker host; set this to its LAN IP.
      DOCKER_SERVER_ADDRESS: ${DOCKER_SERVER_ADDRESS:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gamefleet-assets:/app/data/assets
      # Discovery and control of game-server containers on this host (root-equivalent; drop it if unwanted).
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - postgres

  frontend:
    image: h3xachad/gamefleet-frontend:${VERSION:-latest}
    container_name: gamefleet-frontend
    restart: unless-stopped
    environment:
      GAMEFLEET_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  gamefleet-postgres:
  gamefleet-assets:
