name: gamefleet

services:
  backend:
    container_name: gamefleet-backend
    image: ${DOCKER_REPO:-h3xachad}/gamefleet-backend:${VERSION:-latest}
    network_mode: host
    build:
      context: ./backend
      target: ${TARGET:-prod}
    environment:
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-gamefleet}
      DB_USER: ${DB_USER:-gamefleet}
      DB_PASSWORD: ${DB_PASSWORD}
      ASSET_CACHE_DIR: /app/data/assets
      # Login: "name:password,name2:password2" (plain or scrypt hashes from `make hash`; escape $ as $$ in .env).
      GAMEFLEET_USERS: ${GAMEFLEET_USERS:-}
      GAMEFLEET_SECRET: ${GAMEFLEET_SECRET:-}
      # Docker discovery of game servers on this host (needs the socket mount below).
      DOCKER_AUTO_IMPORT: ${DOCKER_AUTO_IMPORT:-true}
    volumes:
      - gamefleet-assets:/app/data/assets
      # Lets GameFleet find, control and measure game-server containers. The socket is root-equivalent
      # on the host; remove this line if you only monitor remote servers.
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    container_name: gamefleet-frontend
    image: ${DOCKER_REPO:-h3xachad}/gamefleet-frontend:${VERSION:-latest}
    build:
      context: ./frontend
      target: ${FRONTEND_TARGET:-node-server}
    environment:
      GAMEFLEET_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # Development database behind the "db" profile: `make db` starts it, `make up` does not.
  # Production setups usually point DB_HOST at an existing Postgres; docker-compose-example.yml ships one.
  postgres:
    container_name: gamefleet-postgres
    image: postgres:16
    profiles: [db]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gamefleet}
      POSTGRES_USER: ${DB_USER:-gamefleet}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - gamefleet-postgres:/var/lib/postgresql/data

volumes:
  gamefleet-assets:
  gamefleet-postgres:
