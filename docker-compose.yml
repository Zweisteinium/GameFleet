# GameFleet: `make up` builds the images from source, `docker compose pull && docker compose up -d` runs the
# published ones. Everything is configured through .env (see .env.example). The browser only talks to the
# frontend, which forwards /api to the backend, so only FRONTEND_PORT has to be reachable; BACKEND_PORT exposes
# the API directly (with its Swagger UI when GAMEFLEET_DEV=true).
name: gamefleet

services:
  backend:
    container_name: gamefleet-backend
    image: ${DOCKER_REPO:-lordlayer}/gamefleet_backend:${VERSION:-latest}
    build:
      context: ./backend
      target: ${TARGET:-prod}
    restart: unless-stopped
    environment:
      # true serves the API docs, logs verbosely and shows a banner in the dashboard; not for production.
      GAMEFLEET_DEV: ${GAMEFLEET_DEV:-false}
      # Unset DB_HOST means the Postgres published on this host (make db or your own); native dev uses localhost.
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-gamefleet}
      DB_USER: ${DB_USER:-gamefleet}
      DB_PASSWORD: ${DB_PASSWORD}
      ASSET_CACHE_DIR: /app/data/assets
      # Login: "name:password,name2:password2" (plain or scrypt hashes from `make hash`; escape $ as $$ in .env).
      GAMEFLEET_USERS: ${GAMEFLEET_USERS:-}
      GAMEFLEET_SECRET: ${GAMEFLEET_SECRET:-}
      # Game-server containers on this host (needs the socket mount below) are reached through the Docker host.
      DOCKER_SERVER_ADDRESS: ${DOCKER_SERVER_ADDRESS:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - gamefleet-assets:/app/data/assets
      # Lets GameFleet find, control and measure game-server containers. The socket is root-equivalent
      # on the host; remove this line if you only monitor remote servers.
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    container_name: gamefleet-frontend
    image: ${DOCKER_REPO:-lordlayer}/gamefleet_frontend:${VERSION:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # PostgreSQL behind the "db" profile: `make db` starts it, `make up` does not. Skip it if you already have one.
  postgres:
    container_name: gamefleet-postgres
    image: postgres:16
    profiles: [db]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gamefleet}
      POSTGRES_USER: ${DB_USER:-gamefleet}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - gamefleet-postgres:/var/lib/postgresql/data

volumes:
  gamefleet-assets:
  gamefleet-postgres:
